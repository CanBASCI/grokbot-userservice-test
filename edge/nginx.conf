worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 16k;

  # Sensible laptop defaults — tighten in prod overlays.
  limit_req_zone $binary_remote_addr zone=auth_signup:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=auth_login:10m rate=20r/m;
  limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=30r/m;

  upstream signup_upstream {
    server signup-service:8081;
  }

  upstream login_upstream {
    server login-service:8082;
  }

  server {
    listen 8080;
    server_name _;

    # Never expose signup internal APIs on the public edge.
    location ^~ /internal/ {
      default_type application/json;
      return 404 '{"title":"Not Found","status":404}';
    }

    location = /v1/auth/signup {
      limit_req zone=auth_signup burst=3 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://signup_upstream;
    }

    location = /v1/auth/login {
      limit_req zone=auth_login burst=10 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://login_upstream;
    }

    location = /v1/auth/refresh {
      limit_req zone=auth_refresh burst=10 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://login_upstream;
    }

    location / {
      default_type application/json;
      return 404 '{"title":"Not Found","status":404}';
    }
  }
}
