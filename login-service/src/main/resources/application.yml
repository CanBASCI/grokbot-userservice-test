spring:
  application:
    name: login-service
  main:
    web-application-type: none
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  grpc:
    server:
      port: ${GRPC_PORT:${GRPC_SERVER_PORT:9090}}
    client:
      channel:
        signup:
          target: ${SIGNUP_GRPC_TARGET:static://localhost:9090}

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
  refresh:
    ttl-seconds: ${REFRESH_TTL_SECONDS:2592000}

logging:
  level:
    root: INFO
