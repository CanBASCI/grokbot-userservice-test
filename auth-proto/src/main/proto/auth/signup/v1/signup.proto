syntax = "proto3";
package auth.signup.v1;
option java_multiple_files = true;
option java_package = "com.example.auth.signup.v1";
option java_outer_classname = "SignupProto";

service SignupService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc VerifyCredentials(VerifyCredentialsRequest) returns (VerifyCredentialsResponse);
}
message RegisterRequest { string email = 1; string password = 2; }
message RegisterResponse { string user_id = 1; string email = 2; }
message VerifyCredentialsRequest { string email = 1; string password = 2; }
message VerifyCredentialsResponse { string user_id = 1; string email = 2; }
