# grokbot-auth — api-gateway:8080 public only. gRPC + DBs private. No wipe.
name: grokbot-auth

networks:
  auth_net:
    driver: bridge

volumes:
  signup-db-data:
  login-db-data:

services:
  signup-db:
    image: postgres:16-alpine
    container_name: signup-db
    networks: [auth_net]
    environment:
      POSTGRES_DB: signup
      POSTGRES_USER: ${SIGNUP_DB_USER:-signup}
      POSTGRES_PASSWORD: ${SIGNUP_DB_PASSWORD:?set SIGNUP_DB_PASSWORD in .env}
    volumes:
      - signup-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d signup"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"

  login-db:
    image: postgres:16-alpine
    container_name: login-db
    networks: [auth_net]
    environment:
      POSTGRES_DB: login
      POSTGRES_USER: ${LOGIN_DB_USER:-login}
      POSTGRES_PASSWORD: ${LOGIN_DB_PASSWORD:?set LOGIN_DB_PASSWORD in .env}
    volumes:
      - login-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d login"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"

  signup-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.signup
    image: grokbot-auth-signup:local
    container_name: signup-service
    networks: [auth_net]
    depends_on:
      signup-db:
        condition: service_healthy
    environment:
      GRPC_SERVER_PORT: "9091"
      SPRING_DATASOURCE_URL: jdbc:postgresql://signup-db:5432/signup
      SPRING_DATASOURCE_USERNAME: ${SIGNUP_DB_USER:-signup}
      SPRING_DATASOURCE_PASSWORD: ${SIGNUP_DB_PASSWORD:?set SIGNUP_DB_PASSWORD in .env}
    # gRPC 9091 NOT published to host
    expose:
      - "9091"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/9091'"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 120s
    restart: "no"

  login-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.login
    image: grokbot-auth-login:local
    container_name: login-service
    networks: [auth_net]
    depends_on:
      login-db:
        condition: service_healthy
      signup-service:
        condition: service_healthy
    environment:
      GRPC_SERVER_PORT: "9092"
      SPRING_DATASOURCE_URL: jdbc:postgresql://login-db:5432/login
      SPRING_DATASOURCE_USERNAME: ${LOGIN_DB_USER:-login}
      SPRING_DATASOURCE_PASSWORD: ${LOGIN_DB_PASSWORD:?set LOGIN_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 chars) in .env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      SIGNUP_GRPC_TARGET: ${SIGNUP_GRPC_TARGET:-static://signup-service:9091}
    # gRPC 9092 NOT published to host
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 120s
    restart: "no"

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: grokbot-auth-gateway:local
    container_name: api-gateway
    networks: [auth_net]
    depends_on:
      signup-service:
        condition: service_healthy
      login-service:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SIGNUP_GRPC_TARGET: ${SIGNUP_GRPC_TARGET:-static://signup-service:9091}
      LOGIN_GRPC_TARGET: ${LOGIN_GRPC_TARGET:-static://login-service:9092}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/auth/signup); echo $$code | grep -Eq '405|415|400'",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    restart: "no"
