# grokbot-auth — api-gateway:8080 public only. gRPC 9090 private. No wipe.
name: grokbot-auth

networks:
  auth_net:
    driver: bridge

volumes:
  signup-db-data:
  login-db-data:

services:
  signup-db:
    image: postgres:18
    container_name: signup-db
    networks: [auth_net]
    environment:
      POSTGRES_DB: signup
      POSTGRES_USER: ${SIGNUP_DB_USER:-signup}
      POSTGRES_PASSWORD: ${SIGNUP_DB_PASSWORD:?set SIGNUP_DB_PASSWORD in .env}
    volumes:
      - signup-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d signup"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    restart: "no"

  login-db:
    image: postgres:18
    container_name: login-db
    networks: [auth_net]
    environment:
      POSTGRES_DB: login
      POSTGRES_USER: ${LOGIN_DB_USER:-login}
      POSTGRES_PASSWORD: ${LOGIN_DB_PASSWORD:?set LOGIN_DB_PASSWORD in .env}
    volumes:
      - login-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d login"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    restart: "no"

  signup-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.signup
    image: grokbot-auth-signup:local
    # no container_name — required for --scale
    networks: [auth_net]
    depends_on:
      signup-db:
        condition: service_healthy
    environment:
      GRPC_PORT: "9090"
      GRPC_SERVER_PORT: "9090"
      SPRING_DATASOURCE_URL: jdbc:postgresql://signup-db:5432/signup
      SPRING_DATASOURCE_USERNAME: ${SIGNUP_DB_USER:-signup}
      SPRING_DATASOURCE_PASSWORD: ${SIGNUP_DB_PASSWORD:?set SIGNUP_DB_PASSWORD in .env}
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 120s
    mem_limit: 768m
    cpus: 1.0
    restart: "no"

  login-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.login
    image: grokbot-auth-login:local
    networks: [auth_net]
    depends_on:
      login-db:
        condition: service_healthy
      signup-service:
        condition: service_healthy
    environment:
      GRPC_PORT: "9090"
      GRPC_SERVER_PORT: "9090"
      SPRING_DATASOURCE_URL: jdbc:postgresql://login-db:5432/login
      SPRING_DATASOURCE_USERNAME: ${LOGIN_DB_USER:-login}
      SPRING_DATASOURCE_PASSWORD: ${LOGIN_DB_PASSWORD:?set LOGIN_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 chars) in .env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      SIGNUP_GRPC_TARGET: ${SIGNUP_GRPC_TARGET:-static://signup-service:9090}
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 120s
    mem_limit: 768m
    cpus: 1.0
    restart: "no"

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: grokbot-auth-gateway:local
    # no container_name — leave scale path open; Make never scales gateway >1
    networks: [auth_net]
    depends_on:
      signup-service:
        condition: service_healthy
      login-service:
        condition: service_healthy
    environment:
      # Process listen fixed at 8080; host map uses HTTP_PORT on the left side only
      HTTP_PORT: "8080"
      SERVER_PORT: "8080"
      SIGNUP_GRPC_TARGET: ${SIGNUP_GRPC_TARGET:-static://signup-service:9090}
      LOGIN_GRPC_TARGET: ${LOGIN_GRPC_TARGET:-static://login-service:9090}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    mem_limit: 512m
    cpus: 1.0
    restart: "no"
