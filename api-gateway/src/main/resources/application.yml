server:
  port: ${HTTP_PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: api-gateway
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  grpc:
    client:
      channel:
        signup:
          target: ${SIGNUP_GRPC_TARGET:static://localhost:9090}
          default:
            load-balancing-policy: round_robin
        login:
          target: ${LOGIN_GRPC_TARGET:static://localhost:9090}
          default:
            load-balancing-policy: round_robin

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: ""

logging:
  level:
    root: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{code:-}]"
