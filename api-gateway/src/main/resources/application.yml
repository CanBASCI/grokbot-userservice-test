server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: api-gateway
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  grpc:
    client:
      channel:
        signup:
          target: ${SIGNUP_GRPC_TARGET:static://localhost:9091}
        login:
          target: ${LOGIN_GRPC_TARGET:static://localhost:9092}

logging:
  level:
    root: INFO
