spring:
  application:
    name: signup-service
  main:
    web-application-type: none
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  grpc:
    server:
      port: ${GRPC_PORT:${GRPC_SERVER_PORT:9090}}

logging:
  level:
    root: INFO
